# Stages a new npm version when a GitHub Release is published. npm trusted publishing (OIDC)
# authenticates the job, so no npm token is stored. A maintainer then approves the staged
# version with 2FA on npmjs.com (or `npm stage approve`) before it is public.
#
# The package supports Node 18 and later, but the toolchain needs Node 22.12. So the bundles
# are built and fully tested on Node 24, smoke-tested on the older versions, and that same
# build is what gets published. No job here uses a dependency cache: what this workflow
# builds is what ships, so it installs from the lockfile every time.

name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        package-manager-cache: false
    - name: Check the release tag matches package.json
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: test "v$(node -p "require('./package.json').version")" = "$TAG"
    # The npm that writes package-lock.json (see node.js.yml), whatever Node 24 bundles
    - run: npm install -g npm@11
    # TypeScript 7's compiler is a per-platform optional dependency, so never --omit=optional
    - run: npm ci
    - run: npm run lint
    - run: npm run build
    - run: npm run typecheck
    - run: npm test
    - run: npm run test:smoke
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    # No npm ci: the smoke tests use only node:test and the built bundles.
    - run: npm run test:smoke

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # lets npm exchange a GitHub OIDC token for a short-lived publish token

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        registry-url: https://registry.npmjs.org
        package-manager-cache: false
    # npm stage needs npm 11.15 or later. Pin the major: npm@latest is now npm 12.
    - run: npm install -g npm@11
    # The bundles built and tested above. No npm ci here, so no dependency code
    # runs in the job that holds the OIDC token, and nothing rebuilds dist/:
    # the package has no prepare or prepublish script.
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - run: npm stage publish
